function hdrs(token) {
  return {
    "apikey": ANON,
    "Authorization": `Bearer ${token || ANON}`,
    "Content-Type": "application/json",
    "Prefer": "return=representation",
  };
}

async function api(method, path, body, token) {
  const res = await fetch(`${URL_}${path}`, {
    method, headers: hdrs(token), body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const txt = await res.text();
    let msg = txt;
    try { msg = JSON.parse(txt).message || JSON.parse(txt).error_description || txt; } catch {}
    throw new Error(msg);
  }
  const t = await res.text();
  return t ? JSON.parse(t) : [];
}

function timeAgo(ts) {
  const m = Math.floor((Date.now() - new Date(ts)) / 60000);
  if (m < 1) return "agora";
  if (m < 60) return `${m}min atrás`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h atrás`;
  return `${Math.floor(h/24)}d atrás`;
}

function Spinner() {
  return <div style={{ width:18, height:18, border:"2px solid rgba(255,255,255,.3)", borderTop:"2px solid #fff", borderRadius:"50%", animation:"spin .7s linear infinite", display:"inline-block", verticalAlign:"middle" }}/>;
}

function InstallBanner() {
  const [show, setShow]         = useState(false);
  const [canPrompt, setCanPrompt] = useState(false);
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream && !window.navigator.standalone;
  const isAndroid = /android/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

  useEffect(() => {
    if (isStandalone) return; // já instalado
    setShow(true);
    if (window.__installPrompt) setCanPrompt(true);
    const h = () => setCanPrompt(true);
    window.addEventListener('installready', h);
    return () => window.removeEventListener('installready', h);
  }, []);

  async function doInstall() {
    if (window.__installPrompt) {
      window.__installPrompt.prompt();
      await window.__installPrompt.userChoice;
      window.__installPrompt = null;
      setShow(false);
    }
  }

  if (!show) return null;

  return (
    <div style={{ marginTop:14, background:C.blueLight, border:`1.5px solid ${C.border}`, borderRadius:14, padding:"14px 16px" }}>
      <p style={{ fontWeight:700, fontSize:14, color:C.text, marginBottom:6 }}>📲 Instalar como app</p>
      {isIOS ? (
        <p style={{ fontSize:13, color:C.muted, lineHeight:1.7 }}>
          No <strong>Safari</strong>, toque em <strong>Compartilhar ⬆️</strong> e depois em <strong>"Adicionar à tela de início"</strong>
        </p>
      ) : canPrompt ? (
        <button onClick={doInstall} style={{ ...s.btn, marginTop:8, fontSize:13, padding:"10px 0" }}>
          ⬇️ Instalar o app agora
        </button>
      ) : (
        <p style={{ fontSize:13, color:C.muted, lineHeight:1.7 }}>
          No <strong>Chrome</strong>, toque nos <strong>3 pontos ⋮</strong> do menu e depois em <strong>"Adicionar à tela inicial"</strong>
        </p>
      )}
    </div>
  );
}

function AuthScreen({ onAuth }) {
  const [tab,       setTab]       = useState("login");
  const [email,     setEmail]     = useState("");
  const [pw,        setPw]        = useState("");
  const [name,      setName]      = useState("");
  const [emoji,     setEmoji]     = useState("🙏");
  const [busy,      setBusy]      = useState(false);
  const [err,       setErr]       = useState("");
  const [recover,   setRecover]   = useState(false);
  const [recoverOk, setRecoverOk] = useState(false);

  async function doRecover() {
    if (!email) { setErr("Digite seu e-mail para redefinir a senha."); return; }
    setBusy(true); setErr("");
    try {
      await authRecover(email);
      setRecoverOk(true);
    } catch(e) {
      setErr("Erro ao enviar e-mail. Verifique o endereço.");
    }
    setBusy(false);
  }

  async function doLogin() {
    if (!email || !pw) { setErr("Preencha e-mail e senha."); return; }
    setBusy(true); setErr("");
    try {
      const data = await authLogin(email, pw);
      if (!data.access_token) throw new Error("Resposta inválida do servidor.");
      const members = await dbGet("pgm_members", `?user_id=eq.${data.user.id}&select=*`, data.access_token);
      onAuth({ token: data.access_token, user: data.user, member: members[0] || null });
    } catch (e) {
      setErr("E-mail ou senha incorretos. Verifique e tente novamente.");
    }
    setBusy(false);
  }

  async function doSignup() {
    if (!email || !pw || !name.trim()) { setErr("Preencha todos os campos."); return; }
    if (pw.length < 6) { setErr("A senha deve ter ao menos 6 caracteres."); return; }
    setBusy(true); setErr("");
    try {
      const data = await authSignup(email, pw);
      if (!data.access_token) {
        setErr("✅ Cadastro enviado! Confirme seu e-mail e depois faça login.");
        setBusy(false); return;
      }
      const [member] = await dbPost("pgm_members", { name: name.trim(), emoji, user_id: data.user.id }, data.access_token);
      onAuth({ token: data.access_token, user: data.user, member });
    } catch (e) {
      if (e.message.includes("already registered")) setErr("E-mail já cadastrado. Faça login.");
      else setErr(`Erro: ${e.message}`);
    }
    setBusy(false);
  }

  return (
    <div style={{ ...s.app, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"24px 16px" }}>
      <div style={{ width:"100%", maxWidth:400 }}>
        <div style={{ textAlign:"center", marginBottom:32 }}>
          <div style={{ fontSize:52 }}>🕊️</div>
          <h1 style={{ fontFamily:"'Playfair Display',Georgia,serif", fontSize:26, color:C.text, fontWeight:700, marginTop:8 }}>PGM</h1>
          <p style={{ color:C.muted, fontSize:14, marginTop:4 }}>Pedidos de Oração</p>
        </div>
        <div style={{ ...s.card, padding:"24px 20px 28px" }}>
          <div style={{ display:"flex", borderBottom:`1px solid ${C.border}`, marginBottom:20 }}>
            <button style={{ ...s.tab, ...(tab==="login"  ? s.tabAct : {}) }} onClick={() => { setTab("login");  setErr(""); }}>Entrar</button>
            <button style={{ ...s.tab, ...(tab==="signup" ? s.tabAct : {}) }} onClick={() => { setTab("signup"); setErr(""); }}>Cadastrar</button>
          </div>
          {/* Tela de recuperação de senha */}
          {recover ? (
            recoverOk ? (
              <div style={{ textAlign:"center", padding:"8px 0 4px" }}>
                <div style={{ fontSize:36, marginBottom:10 }}>📬</div>
                <p style={{ fontWeight:700, color:C.text, marginBottom:6 }}>E-mail enviado!</p>
                <p style={{ color:C.muted, fontSize:13, marginBottom:16 }}>Verifique sua caixa de entrada e siga o link para criar uma nova senha.</p>
                <button style={{ ...s.ghost, width:"100%" }} onClick={() => { setRecover(false); setRecoverOk(false); setErr(""); }}>Voltar ao login</button>
              </div>
            ) : (
              <>
                <p style={{ color:C.muted, fontSize:13, marginBottom:12 }}>Digite seu e-mail e enviaremos um link para redefinir sua senha.</p>
                {err && <div style={s.errBox}>{err}</div>}
                <input style={s.input} placeholder="Seu e-mail..." type="email" value={email} onChange={e => setEmail(e.target.value)}
                  onKeyDown={e => e.key==="Enter" && doRecover()}/>
                <button className="btn-press" style={{ ...s.btn, opacity:busy?.8:1 }} onClick={doRecover}>
                  {busy ? <Spinner/> : "Enviar link de redefinição"}
                </button>
                <button style={{ ...s.ghost, width:"100%", marginTop:10, textAlign:"center" }}
                  onClick={() => { setRecover(false); setErr(""); }}>Voltar</button>
              </>
            )
          ) : (<>
          {err && <div style={s.errBox}>{err}</div>}
          {tab === "signup" && <>
            <span style={{ ...s.label, marginBottom:8 }}>Seu emoji no grupo</span>
            <div style={s.emojiGrid}>
              {EMOJIS.map(e => (
                <button key={e} onClick={() => setEmoji(e)} style={{ fontSize:22, background:emoji===e?"#E0F0FF":C.blueLight, border:`2px solid ${emoji===e?C.blue:"transparent"}`, borderRadius:12, padding:"6px 0", cursor:"pointer" }}>{e}</button>
              ))}
            </div>
            <input style={s.input} placeholder="Seu nome no grupo..." value={name} onChange={e => setName(e.target.value)}/>
          </>}
          <input style={s.input} placeholder="E-mail..." type="email" value={email} onChange={e => setEmail(e.target.value)}/>
          <input style={s.input} placeholder="Senha (mín. 6 caracteres)..." type="password" value={pw}
            onChange={e => setPw(e.target.value)}
            onKeyDown={e => e.key==="Enter" && (tab==="login" ? doLogin() : doSignup())}/>
          <button className="btn-press" style={{ ...s.btn, opacity:busy?.8:1 }} onClick={tab==="login" ? doLogin : doSignup}>
            {busy ? <Spinner/> : (tab==="login" ? "Entrar" : "Criar conta")}
          </button>
          {tab==="login" && (
            <button onClick={() => { setRecover(true); setErr(""); }}
              style={{ background:"none", border:"none", color:C.muted, fontSize:13, cursor:"pointer", marginTop:12, width:"100%", textAlign:"center", textDecoration:"underline", fontFamily:"inherit" }}>
              Esqueci minha senha
            </button>
          )}
          </>)}
        </div>
        <p style={{ textAlign:"center", color:C.muted, fontSize:12, marginTop:16 }}>Acesso restrito ao grupo 🔒</p>

        <InstallBanner/>
      </div>
    </div>
  );
}

// ── APP PRINCIPAL ────────────────────────────────────────────────────────────
function AppMain({ session, onLogout }) {
  const { token, member: me } = session;

  const [activeTab,    setActiveTab]   = useState("prayers");
  const [showMembers,  setShowMembers] = useState(false);
  const [members,   setMembers]  = useState([]);
  const [requests,  setRequests] = useState([]);
  const [intercs,   setIntercs]  = useState([]);
  const [modal,     setModal]    = useState(null);
  const [loading,   setLoading]  = useState(true);
  const [saving,    setSaving]   = useState(false);
  const [filter,    setFilter]   = useState("all");
  const [reqTitle,  setReqTitle] = useState("");
  const [reqBody,   setReqBody]  = useState("");
  const [error,     setError]    = useState(null);
  const [editName,  setEditName] = useState("");
  const [editEmoji, setEditEmoji]= useState("🙏");

  const fetchAll = useCallback(async () => {
    try {
      const [m, r, i] = await Promise.all([
        dbGet("pgm_members",       "?order=joined_at.asc&select=*",  token),
        dbGet("pgm_requests",      "?order=created_at.desc&select=*", token),
        dbGet("pgm_intercessions", "?select=*",                       token),
      ]);
      setMembers(m); setRequests(r); setIntercs(i); setError(null);
    } catch(e) {
      if (e.message.includes("JWT") || e.message.includes("expired") || e.message.includes("invalid claim")) {
        // Sessão expirada — limpar e voltar ao login
        try { localStorage.removeItem("pgm_session"); } catch {}
        onLogout();
        return;
      }
      setError(`Erro ao carregar: ${e.message}`);
    } finally { setLoading(false); }
  }, [token, onLogout]);

  useEffect(() => { fetchAll(); }, []);
  useEffect(() => { const t = setInterval(fetchAll, 30000); return () => clearInterval(t); }, []);

  async function saveProfile() {
    if (!editName.trim()) return;
    setSaving(true);
    try {
      await dbPatch("pgm_members", me.id, { name: editName.trim(), emoji: editEmoji }, token);
      // Atualizar sessão local
      const updatedMember = { ...me, name: editName.trim(), emoji: editEmoji };
      const updatedSession = { ...session, member: updatedMember };
      try { localStorage.setItem("pgm_session", JSON.stringify(updatedSession)); } catch {}
      // Recarregar para refletir mudanças
      await fetchAll();
      setModal(null);
      // Forçar reload para atualizar o header
      window.location.reload();
    } catch(e) {
      setError(`Erro ao salvar perfil: ${e.message}`);
    }
    setSaving(false);
  }

  async function addRequest() {
    if (!reqTitle.trim()) return;
    if (!me?.id) { setError("Perfil não encontrado. Saia e entre novamente."); return; }
    setSaving(true); setError(null);
    try {
      const [r] = await dbPost("pgm_requests",
        { member_id: me.id, title: reqTitle.trim(), body: reqBody.trim() || null }, token);
      setRequests(p => [r, ...p]);
      setReqTitle(""); setReqBody(""); setModal(null);
    } catch(e) {
      setError(`Erro ao salvar pedido: ${e.message}`);
    }
    setSaving(false);
  }

  async function togglePray(requestId) {
    if (!me?.id) return;
    const existing = intercs.find(i => i.request_id===requestId && i.member_id===me.id);
    try {
      if (existing) {
        setIntercs(p => p.filter(i => i.id!==existing.id));
        await dbDel("pgm_intercessions", `?id=eq.${existing.id}`, token);
      } else {
        const [i] = await dbPost("pgm_intercessions", { request_id:requestId, member_id:me.id }, token);
        setIntercs(p => [...p, i]);
      }
    } catch(e) { setError(`Erro: ${e.message}`); }
  }

  async function toggleAnswered(req) {
    const val = { answered: !req.answered };
    setRequests(p => p.map(r => r.id===req.id ? { ...r, ...val } : r));
    try { await dbPatch("pgm_requests", req.id, val, token); }
    catch(e) { setError(`Erro: ${e.message}`); fetchAll(); }
  }

  async function deleteRequest(id) {
    setRequests(p => p.filter(r => r.id!==id));
    setIntercs(p => p.filter(i => i.request_id!==id));
    try { await dbDel("pgm_requests", `?id=eq.${id}`, token); }
    catch(e) { setError(`Erro: ${e.message}`); fetchAll(); }
  }

  const member   = id => members.find(m => m.id===id);
  const filtered = requests.filter(r =>
    filter==="mine"     ? r.member_id===me?.id :
    filter==="answered" ? r.answered :
    filter==="pending"  ? !r.answered : true
  );

  if (loading) return (
    <div style={{ ...s.app, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:12 }}>
      <div style={{ fontSize:48 }}>🕊️</div>
      <p style={{ color:C.muted, fontSize:14 }}>Carregando...</p>
    </div>
  );

  return (
    <div style={s.app}>
      <div style={s.header}>
        <p style={s.htitle}>🕊️ PGM - Pedidos de Oração</p>
        <p style={s.hsub}>{members.length} membros · {requests.filter(r=>!r.answered).length} pedidos ativos · {intercs.length} intercessões</p>
        {me && (
          <div style={{ marginTop:10, display:"inline-flex", alignItems:"center", gap:8, background:"rgba(255,255,255,0.12)", borderRadius:40, padding:"5px 14px 5px 10px" }}>
            <span style={{ fontSize:17 }}>{me.emoji}</span>
            <span style={{ fontSize:13, fontWeight:600 }}>{me.name}</span>
            <button onClick={() => { setEditName(me.name); setEditEmoji(me.emoji); setModal("profile"); }}
              style={{ background:"transparent", border:"1px solid rgba(255,255,255,.3)", color:"#fff", opacity:.8, cursor:"pointer", fontSize:12, padding:"2px 8px", borderRadius:20, fontFamily:"inherit" }}>✏️</button>
            <button onClick={onLogout} style={{ background:"transparent", border:"1px solid rgba(255,255,255,.3)", color:"#fff", opacity:.8, cursor:"pointer", fontSize:12, padding:"2px 8px", borderRadius:20, fontFamily:"inherit" }}>Sair</button>
          </div>
        )}
      </div>

      {error && (
        <div style={{ ...s.errBox, margin:"12px 16px 0" }}>
          ⚠️ {error}
          <button onClick={() => setError(null)} style={{ float:"right", background:"none", border:"none", cursor:"pointer", color:C.error, fontSize:16 }}>×</button>
        </div>
      )}

      {activeTab === "prayers" && <div>
      <div style={{ padding:"12px 16px 0" }}>
        <button onClick={() => setShowMembers(p => !p)}
          style={{ display:"flex", alignItems:"center", gap:6, background:"transparent", border:"none", cursor:"pointer", padding:0, fontFamily:"inherit" }}>
          <span style={s.label}>👥 Membros ({members.length})</span>
          <span style={{ fontSize:12, color:C.muted, marginBottom:10 }}>{showMembers ? "▲" : "▼"}</span>
        </button>
        {showMembers && (
          <div style={{ display:"flex", flexWrap:"wrap", marginTop:4 }}>
            {members.map(m => (
              <div key={m.id} style={{ ...s.chip, cursor:"default", ...(m.id===me?.id ? { background:"linear-gradient(135deg,#3A86C8,#6DB3E8)", color:"#fff", border:"1.5px solid #3A86C8" } : {}) }}>
                <span style={{ fontSize:18 }}>{m.emoji}</span>
                <span>{m.name}{m.id===me?.id ? " (você)" : ""}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={{ ...s.section, display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8, paddingTop:14 }}>
        <div style={{ display:"flex", gap:6 }}>
          {[["all","Todos"],["pending","Em espera"],["mine","Meus"],["answered","Respondidos"]].map(([v,l]) => (
            <button key={v} onClick={() => setFilter(v)}
              style={{ ...s.ghost, ...(filter===v ? { background:C.blueLight, borderColor:C.blue, color:C.text } : {}) }}>
              {l}
            </button>
          ))}
        </div>
        <button className="btn-press" style={s.btnSm} onClick={() => setModal("request")}>+ Novo pedido</button>
      </div>

      <div style={{ ...s.section, paddingTop:14 }}>
        {filtered.length===0 && (
          <p style={{ textAlign:"center", color:C.muted, padding:"28px 0", fontStyle:"italic", fontSize:14 }}>Nenhum pedido aqui ainda. 💛</p>
        )}
        {filtered.map(req => {
          const author  = member(req.member_id);
          const reqI    = intercs.filter(i => i.request_id===req.id);
          const iPrayed = reqI.some(i => i.member_id===me?.id);
          const isOwner = me?.id===req.member_id;
          return (
            <div key={req.id} className="fade"
              style={{ ...s.card, ...(req.answered ? { borderColor:C.answered, background:C.answeredBg } : {}) }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8 }}>
                <div style={{ flex:1 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:3 }}>
                    <span style={{ fontSize:19 }}>{author?.emoji||"🙏"}</span>
                    <span style={{ fontWeight:700, fontSize:15 }}>{req.title}</span>
                  </div>
                  <div style={{ fontSize:12, color:C.muted }}>{author?.name} · {timeAgo(req.created_at)}</div>
                  {req.body && <p style={{ marginTop:8, fontSize:14, lineHeight:1.65 }}>{req.body}</p>}
                </div>
                {req.answered && <span style={s.answTag}>✅ Respondida</span>}
              </div>
              <hr style={s.divider}/>
              <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                <button onClick={() => togglePray(req.id)}
                  style={{ ...s.ghost, ...(iPrayed ? { background:"#E0F0FF", borderColor:C.blue, color:"#1A5C8A" } : {}) }}>
                  🙏 {iPrayed ? "Orei por isso" : "Orar por isso"}
                </button>
                {reqI.length>0 && (
                  <span style={{ fontSize:13, color:C.muted, fontStyle:"italic" }}>
                    {reqI.length} {reqI.length===1?"pessoa orou":"pessoas oraram"}
                    <span style={{ marginLeft:5 }}>{reqI.slice(0,5).map(i=>member(i.member_id)?.emoji).filter(Boolean).join("")}</span>
                  </span>
                )}
                {isOwner && <>
                  <button style={s.answBtn} onClick={() => toggleAnswered(req)}>
                    {req.answered ? "↩ Desfazer" : "✅ Respondida!"}
                  </button>
                  <button onClick={() => deleteRequest(req.id)}
                    style={{ ...s.ghost, color:C.error, borderColor:"#F1B0A8" }}>🗑</button>
                </>}
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ textAlign:"center", padding:"16px 0 0" }}>
        <button style={s.ghost} onClick={fetchAll}>↻ Atualizar</button>
      </div>

      </div>}

      {activeTab === "meetings" && <MeetingsTab session={session} members={members}/>}

      {/* Bottom nav */}
      <div style={{ position:"fixed", bottom:0, left:0, right:0, background:C.card, borderTop:`1.5px solid ${C.border}`, display:"flex", zIndex:20, boxShadow:"0 -2px 12px rgba(26,53,80,.08)" }}>
        {[["prayers","🙏","Orações"],["meetings","📅","Reuniões"]].map(([tab,icon,label]) => (
          <button key={tab} onClick={() => setActiveTab(tab)}
            style={{ flex:1, padding:"12px 0 10px", border:"none", background:"transparent", cursor:"pointer",
              color: activeTab===tab ? C.blue : C.muted,
              borderTop: activeTab===tab ? `2.5px solid ${C.blue}` : "2.5px solid transparent",
              fontSize:11, fontWeight:700, letterSpacing:".06em", fontFamily:"'Lora',Georgia,serif",
              display:"flex", flexDirection:"column", alignItems:"center", gap:3 }}>
            <span style={{ fontSize:20 }}>{icon}</span>
            <span>{label}</span>
          </button>
        ))}
      </div>

      {modal==="request" && (
        <div style={s.modal} onClick={e => e.target===e.currentTarget && setModal(null)}>
          <div style={s.modalBox}>
            <span style={s.mTitle}>Novo pedido de oração 🙏</span>
            <input style={s.input} placeholder="Título do pedido..." value={reqTitle} onChange={e => setReqTitle(e.target.value)}/>
            <textarea style={s.textarea} placeholder="Detalhes (opcional)..." value={reqBody} onChange={e => setReqBody(e.target.value)}/>
            <div style={{ display:"flex", gap:10, marginTop:10 }}>
              <button className="btn-press" style={{ ...s.btnSm, flex:1, opacity:saving?.8:1 }} onClick={addRequest}>
                {saving ? <Spinner/> : "Compartilhar"}
              </button>
              <button style={s.ghost} onClick={() => setModal(null)}>Cancelar</button>
            </div>
          </div>
        </div>
      )}

      {modal==="profile" && (
        <div style={s.modal} onClick={e => e.target===e.currentTarget && setModal(null)}>
          <div style={s.modalBox}>
            <span style={s.mTitle}>✏️ Editar perfil</span>
            <span style={{ ...s.label, marginBottom:8 }}>Seu emoji</span>
            <div style={s.emojiGrid}>
              {["🙏","✨","🌿","🕊️","💛","🌸","🌻","🦋","🌙","⭐","🫶","💫"].map(e => (
                <button key={e} onClick={() => setEditEmoji(e)} style={{
                  fontSize:22, background:editEmoji===e?"#E0F0FF":C.blueLight,
                  border:`2px solid ${editEmoji===e?C.blue:"transparent"}`,
                  borderRadius:12, padding:"6px 0", cursor:"pointer"
                }}>{e}</button>
              ))}
            </div>
            <input style={s.input} placeholder="Seu nome..." value={editName}
              onChange={e => setEditName(e.target.value)}
              onKeyDown={e => e.key==="Enter" && saveProfile()}/>
            <div style={{ display:"flex", gap:10, marginTop:4 }}>
              <button className="btn-press" style={{ ...s.btnSm, flex:1, opacity:saving?.8:1 }} onClick={saveProfile}>
                {saving ? <Spinner/> : "Salvar"}
              </button>
              <button style={s.ghost} onClick={() => setModal(null)}>Cancelar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


// ── LISTA DE CONFIRMADOS ─────────────────────────────────────────────────────
function ConfirmList({ confirms, member }) {
  const [expanded, setExpanded] = useState(false);
  const LIMIT = 6;
  const shown = expanded ? confirms : confirms.slice(0, LIMIT);
  const extra = confirms.length - LIMIT;

  return (
    <span style={{ display:"flex", flexWrap:"wrap", gap:4, alignItems:"center" }}>
      {shown.map(c => {
        const m = member(c.member_id);
        if (!m) return null;
        return (
          <span key={c.id} style={{ display:"inline-flex", alignItems:"center", gap:4, background:C.blueLight, border:`1px solid ${C.border}`, borderRadius:20, padding:"2px 8px 2px 6px", fontSize:12 }}>
            <span>{m.emoji}</span><span style={{ fontWeight:600 }}>{m.name}</span>
          </span>
        );
      })}
      {!expanded && extra > 0 && (
        <button onClick={() => setExpanded(true)}
          style={{ fontSize:12, color:C.blue, fontWeight:700, background:"transparent", border:`1px solid ${C.border}`, borderRadius:20, padding:"2px 10px", cursor:"pointer", fontFamily:"inherit" }}>
          +{extra} ver todos
        </button>
      )}
      {expanded && confirms.length > LIMIT && (
        <button onClick={() => setExpanded(false)}
          style={{ fontSize:12, color:C.muted, background:"transparent", border:`1px solid ${C.border}`, borderRadius:20, padding:"2px 10px", cursor:"pointer", fontFamily:"inherit" }}>
          ver menos
        </button>
      )}
    </span>
  );
}

// ── ABA REUNIÕES ──────────────────────────────────────────────────────────────
function MeetingsTab({ session, members }) {
  const { token, member: me } = session;
  const [meetings,  setMeetings]  = useState([]);
  const [confirms,  setConfirms]  = useState([]);
  const [modal,     setModal]     = useState(null); // null | "create" | meeting obj
  const [saving,    setSaving]    = useState(false);
  const [error,     setError]     = useState(null);

  const [mDate,  setMDate]  = useState("");
  const [mTime,  setMTime]  = useState("");
  const [mLocal, setMLocal] = useState("");
  const [mNotes, setMNotes] = useState("");

  const today = new Date().toISOString().slice(0, 10);

  async function fetchMeetings() {
    try {
      const [mt, cf] = await Promise.all([
        dbGet("pgm_meetings",             "?order=date.asc,time.asc&select=*", token),
        dbGet("pgm_meeting_confirmations","?select=*", token),
      ]);
      // Apenas reuniões de hoje em diante
      setMeetings(mt.filter(m => m.date >= today));
      setConfirms(cf);
      setError(null);
    } catch(e) { setError(`Erro ao carregar reuniões: ${e.message}`); }
  }

  useEffect(() => { fetchMeetings(); }, []);

  function openCreate() {
    setMDate(""); setMTime(""); setMLocal(""); setMNotes("");
    setModal("create");
  }

  function openEdit(m) {
    setMDate(m.date); setMTime(m.time.slice(0,5)); setMLocal(m.location||""); setMNotes(m.notes||"");
    setModal(m);
  }

  async function saveMeeting() {
    if (!mDate || !mTime) { setError("Data e hora são obrigatórias."); return; }
    setSaving(true); setError(null);
    try {
      if (modal === "create") {
        const [m] = await dbPost("pgm_meetings",
          { member_id: me.id, date: mDate, time: mTime, location: mLocal||null, notes: mNotes||null }, token);
        setMeetings(p => [...p, m].filter(x => x.date >= today).sort((a,b) => a.date.localeCompare(b.date)||a.time.localeCompare(b.time)));
      } else {
        await dbPatch("pgm_meetings", modal.id, { date: mDate, time: mTime, location: mLocal||null, notes: mNotes||null }, token);
        setMeetings(p => p.map(x => x.id===modal.id ? { ...x, date:mDate, time:mTime, location:mLocal||null, notes:mNotes||null } : x));
      }
      setModal(null);
    } catch(e) { setError(`Erro ao salvar: ${e.message}`); }
    setSaving(false);
  }

  async function deleteMeeting(id) {
    if (!confirm("Excluir esta reunião?")) return;
    setMeetings(p => p.filter(m => m.id!==id));
    setConfirms(p => p.filter(c => c.meeting_id!==id));
    await dbDel("pgm_meetings", `?id=eq.${id}`, token);
  }

  async function toggleConfirm(meetingId) {
    if (!me?.id) return;
    const existing = confirms.find(c => c.meeting_id===meetingId && c.member_id===me.id);
    if (existing) {
      setConfirms(p => p.filter(c => c.id!==existing.id));
      await dbDel("pgm_meeting_confirmations", `?id=eq.${existing.id}`, token);
    } else {
      const [c] = await dbPost("pgm_meeting_confirmations", { meeting_id: meetingId, member_id: me.id }, token);
      setConfirms(p => [...p, c]);
    }
  }

  function formatDate(d) {
    const [y,m,day] = d.split("-");
    const names = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
    return `${parseInt(day)} de ${names[parseInt(m)-1]} de ${y}`;
  }

  function formatTime(t) {
    return t.slice(0,5);
  }

  const member = id => members.find(m => m.id===id);

  return (
    <div>
      {error && (
        <div style={{ ...s.errBox, margin:"12px 16px 0" }}>
          ⚠️ {error}
          <button onClick={() => setError(null)} style={{ float:"right", background:"none", border:"none", cursor:"pointer", color:C.error, fontSize:16 }}>×</button>
        </div>
      )}

      <div style={{ ...s.section, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
        <span style={s.label}>📅 Próximas reuniões</span>
        <button className="btn-press" style={{ ...s.btnSm, marginBottom:10 }} onClick={openCreate}>+ Nova reunião</button>
      </div>

      <div style={{ padding:"4px 16px 0" }}>
        {meetings.length===0 && (
          <p style={{ textAlign:"center", color:C.muted, padding:"28px 0", fontStyle:"italic", fontSize:14 }}>
            Nenhuma reunião agendada. 📅
          </p>
        )}
        {meetings.map(m => {
          const mtConfirms = confirms.filter(c => c.meeting_id===m.id);
          const iConfirmed = mtConfirms.some(c => c.member_id===me?.id);
          const isToday    = m.date === today;

          return (
            <div key={m.id} className="fade" style={{ ...s.card, ...(isToday ? { borderColor:C.blue, borderWidth:2 } : {}) }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8 }}>
                <div style={{ flex:1 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4, flexWrap:"wrap" }}>
                    <span style={{ fontWeight:700, fontSize:16, fontFamily:"'Playfair Display',Georgia,serif" }}>Reunião PGM</span>
                    {isToday && (
                      <span style={{ background:C.blue, color:"#fff", fontSize:11, fontWeight:700, borderRadius:20, padding:"2px 9px", letterSpacing:".04em" }}>HOJE</span>
                    )}
                  </div>
                  <div style={{ fontSize:13, color:C.muted, lineHeight:1.8 }}>
                    <div>📅 {formatDate(m.date)}</div>
                    <div>🕐 {formatTime(m.time)}</div>
                    {m.location && <div>📍 {m.location}</div>}
                  </div>
                  {m.notes && <p style={{ marginTop:8, fontSize:14, lineHeight:1.65, color:C.text }}>{m.notes}</p>}
                </div>
                <div style={{ display:"flex", gap:6 }}>
                  <button onClick={() => openEdit(m)} style={{ ...s.ghost, padding:"6px 10px", fontSize:14 }}>✏️</button>
                  <button onClick={() => deleteMeeting(m.id)} style={{ ...s.ghost, padding:"6px 10px", fontSize:14, color:C.error, borderColor:"#F1B0A8" }}>🗑</button>
                </div>
              </div>

              <hr style={s.divider}/>

              <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                <button onClick={() => toggleConfirm(m.id)}
                  style={{ ...s.ghost, ...(iConfirmed ? { background:"#E0F0FF", borderColor:C.blue, color:"#1A5C8A" } : {}) }}>
                  ✅ {iConfirmed ? "Confirmei presença" : "Confirmar presença"}
                </button>
                {mtConfirms.length > 0 && (
                  <span style={{ fontSize:13, color:C.muted, fontStyle:"italic" }}>
                    <ConfirmList confirms={mtConfirms} member={member}/>
                  </span>
                )}
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ textAlign:"center", padding:"16px 0 0" }}>
        <button style={s.ghost} onClick={fetchMeetings}>↻ Atualizar</button>
      </div>

      {/* Modal criar/editar */}
      {modal !== null && (
        <div style={s.modal} onClick={e => e.target===e.currentTarget && setModal(null)}>
          <div style={s.modalBox}>
            <span style={s.mTitle}>{modal==="create" ? "Nova reunião 📅" : "Editar reunião ✏️"}</span>
            <label style={{ ...s.label, marginBottom:4 }}>Data</label>
            <input style={s.input} type="date" value={mDate} onChange={e => setMDate(e.target.value)}/>
            <label style={{ ...s.label, marginBottom:4 }}>Hora</label>
            <input style={s.input} type="time" value={mTime} onChange={e => setMTime(e.target.value)}/>
            <label style={{ ...s.label, marginBottom:4 }}>Local (opcional)</label>
            <input style={s.input} placeholder="Ex: Casa da Bela, Meet..." value={mLocal} onChange={e => setMLocal(e.target.value)}/>
            <label style={{ ...s.label, marginBottom:4 }}>Pauta / Link / Observações</label>
            <textarea style={s.textarea} placeholder="Pauta da reunião, link de acesso..." value={mNotes} onChange={e => setMNotes(e.target.value)}/>
            <div style={{ display:"flex", gap:10, marginTop:10 }}>
              <button className="btn-press" style={{ ...s.btnSm, flex:1, opacity:saving?.8:1 }} onClick={saveMeeting}>
                {saving ? <Spinner/> : "Salvar"}
              </button>
              <button style={s.ghost} onClick={() => setModal(null)}>Cancelar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── ROOT ─────────────────────────────────────────────────────────────────────
function App() {
  const [session, setSession] = useState(null);
  const [booting, setBooting] = useState(true);

  useEffect(() => {
    try {
      const saved = localStorage.getItem("pgm_session");
      if (saved) setSession(JSON.parse(saved));
    } catch {}
    setBooting(false);
  }, []);

  function handleAuth(sess) {
    setSession(sess);
    try { localStorage.setItem("pgm_session", JSON.stringify(sess)); } catch {}
  }

  function handleProfileDone(member) {
    const updated = { ...session, member };
    setSession(updated);
    try { localStorage.setItem("pgm_session", JSON.stringify(updated)); } catch {}
  }

  async function handleLogout() {
    try { await authLogout(session?.token); } catch {}
    setSession(null);
    try { localStorage.removeItem("pgm_session"); } catch {}
  }

  if (booting) return (
    <div style={{ ...s.app, display:"flex", alignItems:"center", justifyContent:"center", fontSize:48 }}>🕊️</div>
  );

  if (!session) return <AuthScreen onAuth={handleAuth}/>;

  // Logado mas sem perfil: pede para completar
  if (!session.member) return <ProfileSetup session={session} onDone={handleProfileDone} onLogout={handleLogout}/>;

  return <AppMain session={session} onLogout={handleLogout}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
